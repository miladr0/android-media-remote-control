name: Build Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media-remote/android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Cache Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -PversionCode=${{ github.run_number }} assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: localcast-receiver-debug-apk
          path: media-remote/android/app/build/outputs/apk/debug/*.apk
      - name: Publish APK as a GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LocalCast Receiver build ${{ github.run_number }}
          prerelease: true
          files: media-remote/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Unit tests
        run: gradle --no-daemon -PversionCode=${{ github.run_number }} testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: media-remote/android/app/build/reports/tests/
